name: Auto-Merge (reusable)

on:
  workflow_call:
    inputs:
      merge_method:
        type: string
        default: squash
    secrets:
      merge_token:
        required: true
      # Optional. When a caller supplies these, the merge runs under a GitHub App
      # installation token instead of merge_token. Both stay optional and
      # merge_token stays required, so every existing caller keeps working
      # unchanged: with no app credentials the mint step fails, continue-on-error
      # swallows it, its output is empty, and GH_TOKEN falls through to merge_token
      # exactly as before.
      app_id:
        required: false
      app_private_key:
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      # `gh pr merge --auto` is a GraphQL call and GitHub's GraphQL bucket is per
      # USER, so merge_token shares one 5,000 pts/hr counter with every interactive
      # `gh` session and every OAuth app on its owner's account. When it empties the
      # merge fails on every open PR at once. An App installation token has its own
      # bucket, and still fires on:push — measured on
      # OrsaNova-Studios-LLC/uc-migrator#10 (merge dd9e99b).
      #
      # continue-on-error is load-bearing twice over here: it is what makes the
      # credentials genuinely optional for existing callers, AND what keeps a bad
      # key from aborting the job before GH_TOKEN is evaluated.
      - name: Mint App installation token
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.app_id }}
          private-key: ${{ secrets.app_private_key }}

      - env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.merge_token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          METHOD: ${{ inputs.merge_method }}
        run: gh pr merge "$PR_URL" --auto --"$METHOD"
